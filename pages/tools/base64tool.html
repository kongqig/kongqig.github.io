<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编码转换器</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card-bg: #ffffff;
            --text: #1a1d2e;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-light: #eef2ff;
            --input-bg: #f9fafb;
            --output-bg: #f3f4f6;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 2px 6px rgba(0, 0, 0, 0.08), 0 8px 32px rgba(0, 0, 0, 0.08);
            --error: #dc2626;
            --error-bg: #fef2f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0f1a;
                --card-bg: #171a2b;
                --text: #e4e6f0;
                --text-secondary: #8b90a5;
                --border: #2a2e42;
                --accent: #6366f1;
                --accent-hover: #818cf8;
                --accent-light: #1e2140;
                --input-bg: #1e2135;
                --output-bg: #1a1d30;
                --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 2px 6px rgba(0, 0, 0, 0.5), 0 8px 32px rgba(0, 0, 0, 0.35);
                --error: #f87171;
                --error-bg: #2d1b1e;
                --success: #4ade80;
                --success-bg: #1b2d1f;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background var(--transition), color var(--transition);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--accent);
            color: #fff;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
            transition: background var(--transition), box-shadow var(--transition);
        }

        .header .logo-icon svg {
            width: 26px;
            height: 26px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.925rem;
            max-width: 420px;
            margin: 0 auto;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 18px;
            align-items: stretch;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
            .swap-wrapper {
                display: flex;
                justify-content: center;
            }
            .swap-btn {
                transform: rotate(90deg);
            }
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px;
            border: 1px solid var(--border);
            transition: box-shadow var(--transition), background var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent-light);
            color: var(--accent);
            flex-shrink: 0;
            transition: background var(--transition), color var(--transition);
        }

        .card-header .icon-badge svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-header h2 {
            font-size: 1.08rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .card-header .badge {
            margin-left: auto;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--accent-light);
            color: var(--accent);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: background var(--transition), color var(--transition);
        }

        /* Input Group */
        .input-group,
        .output-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .input-group label,
        .output-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .input-group label .dot,
        .output-group label .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            flex-shrink: 0;
        }

        .output-group label .dot {
            background: var(--success);
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 0.925rem;
            line-height: 1.55;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            textarea:focus {
                box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.22);
            }
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.65;
            font-size: 0.875rem;
        }

        textarea.output-area {
            background: var(--output-bg);
            font-family: var(--font-mono);
            font-size: 0.84rem;
            line-height: 1.5;
            cursor: text;
            user-select: text;
            min-height: 110px;
        }

        textarea.output-area.error-state {
            border-color: var(--error);
            background: var(--error-bg);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
        }

        textarea.output-area.success-state {
            border-color: var(--success);
            background: var(--success-bg);
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.08);
        }

        /* Meta Row */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .char-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.02em;
            user-select: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-xs);
            border: 1.5px solid transparent;
            font-family: var(--font-sans);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.01em;
            -webkit-user-select: none;
            user-select: none;
            white-space: nowrap;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
            outline: none;
        }

        .btn-copy {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            padding: 7px 14px;
            font-size: 0.78rem;
            border-radius: 8px;
        }

        .btn-copy:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 3px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-copy:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-copy.copied {
            background: var(--success);
            border-color: var(--success);
            box-shadow: 0 3px 12px rgba(22, 163, 74, 0.3);
        }

        .btn-copy.copied:hover {
            background: var(--success);
            border-color: var(--success);
        }

        .btn-clear {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
            padding: 7px 12px;
            font-size: 0.78rem;
            border-radius: 8px;
        }

        .btn-clear:hover {
            background: var(--input-bg);
            border-color: var(--text-secondary);
            color: var(--text);
        }

        .btn-clear:active {
            transform: scale(0.97);
        }

        /* Swap Button */
        .swap-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            box-shadow: var(--shadow);
            flex-shrink: 0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .swap-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.08);
            box-shadow: var(--shadow-hover);
        }

        .swap-btn:active {
            transform: scale(0.94);
        }

        .swap-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeInUp 0.45s ease-out both;
        }

        .card:nth-child(1) {
            animation-delay: 0.05s;
        }
        .card:nth-child(3) {
            animation-delay: 0.1s;
        }

        @keyframes pulse-success {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(22, 163, 74, 0);
            }
        }

        textarea.output-area.just-copied {
            animation: pulse-success 0.6s ease-out;
        }

        /* Error text */
        .error-message {
            font-size: 0.75rem;
            color: var(--error);
            font-weight: 500;
            margin-top: 2px;
            min-height: 1.2em;
            transition: opacity var(--transition);
        }

        /* Responsive fine-tune */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 16px;
            }
            textarea {
                min-height: 100px;
                font-size: 0.875rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .header .logo-icon {
                width: 44px;
                height: 44px;
                border-radius: 13px;
            }
            .header .logo-icon svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <polyline points="4 7 4 4 20 4 20 7" />
                    <line x1="9" y1="20" x2="15" y2="20" />
                    <line x1="12" y1="4" x2="12" y2="20" />
                    <polyline points="8 17 4 20 8 20" />
                    <polyline points="16 17 20 20 16 20" />
                </svg>
            </div>
            <h1>Base64 编码转换器</h1>
            <p>在文本与 Base64 编码之间快速转换 · 支持 Unicode 字符</p>
        </header>

        <!-- Main -->
        <main class="main-grid">
            <!-- Encode Card -->
            <section class="card" aria-label="编码区域">
                <div class="card-header">
                    <span class="icon-badge" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 12h14" />
                            <polyline points="13 6 19 12 13 18" />
                        </svg>
                    </span>
                    <h2>编码</h2>
                    <span class="badge">文本 → Base64</span>
                </div>

                <div class="input-group">
                    <label><span class="dot"></span>输入文本</label>
                    <textarea id="encode-input" placeholder="输入要编码的文本，例如：Hello, 世界！" spellcheck="false" aria-label="输入要编码的文本"></textarea>
                    <div class="meta-row">
                        <span class="char-count" id="encode-input-count">0 字符</span>
                        <button class="btn btn-clear" id="encode-clear" type="button" title="清空输入">清空</button>
                    </div>
                </div>

                <div class="output-group">
                    <label><span class="dot"></span>Base64 编码结果</label>
                    <textarea id="encode-output" class="output-area" placeholder="编码结果将实时显示在这里..." readonly spellcheck="false" aria-label="Base64 编码结果"></textarea>
                    <div class="meta-row">
                        <span class="char-count" id="encode-output-count">0 字符</span>
                        <button class="btn btn-copy" id="encode-copy" type="button" title="复制编码结果">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                            </svg>
                            <span>复制</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Swap Button -->
            <div class="swap-wrapper">
                <button class="swap-btn" id="swap-btn" type="button" title="交换两个区域的内容" aria-label="交换编码和解码内容">
                    <svg viewBox="0 0 24 24">
                        <polyline points="17 1 21 5 17 9" />
                        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                        <polyline points="7 23 3 19 7 15" />
                        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                    </svg>
                </button>
            </div>

            <!-- Decode Card -->
            <section class="card" aria-label="解码区域">
                <div class="card-header">
                    <span class="icon-badge" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 12H5" />
                            <polyline points="11 18 5 12 11 6" />
                        </svg>
                    </span>
                    <h2>解码</h2>
                    <span class="badge">Base64 → 文本</span>
                </div>

                <div class="input-group">
                    <label><span class="dot"></span>输入 Base64 编码</label>
                    <textarea id="decode-input" placeholder="输入要解码的 Base64 字符串，例如：SGVsbG8sIOS4lueVjO+8gQ==" spellcheck="false" aria-label="输入要解码的 Base64 字符串"></textarea>
                    <div class="meta-row">
                        <span class="char-count" id="decode-input-count">0 字符</span>
                        <button class="btn btn-clear" id="decode-clear" type="button" title="清空输入">清空</button>
                    </div>
                </div>

                <div class="output-group">
                    <label><span class="dot"></span>解码结果</label>
                    <textarea id="decode-output" class="output-area" placeholder="解码结果将实时显示在这里..." readonly spellcheck="false" aria-label="解码结果"></textarea>
                    <div class="meta-row">
                        <span class="char-count" id="decode-output-count">0 字符</span>
                        <button class="btn btn-copy" id="decode-copy" type="button" title="复制解码结果">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                            </svg>
                            <span>复制</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            支持 UTF-8 · 实时转换 · 数据仅在本地处理
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM elements
            const encodeInput = document.getElementById('encode-input');
            const encodeOutput = document.getElementById('encode-output');
            const encodeInputCount = document.getElementById('encode-input-count');
            const encodeOutputCount = document.getElementById('encode-output-count');
            const encodeCopyBtn = document.getElementById('encode-copy');
            const encodeClearBtn = document.getElementById('encode-clear');

            const decodeInput = document.getElementById('decode-input');
            const decodeOutput = document.getElementById('decode-output');
            const decodeInputCount = document.getElementById('decode-input-count');
            const decodeOutputCount = document.getElementById('decode-output-count');
            const decodeCopyBtn = document.getElementById('decode-copy');
            const decodeClearBtn = document.getElementById('decode-clear');

            const swapBtn = document.getElementById('swap-btn');

            // Utility: encode text to Base64 (UTF-8 safe)
            function encodeToBase64(text) {
                try {
                    const encoder = new TextEncoder();
                    const bytes = encoder.encode(text);
                    let binary = '';
                    for (const byte of bytes) {
                        binary += String.fromCharCode(byte);
                    }
                    return btoa(binary);
                } catch (err) {
                    return null;
                }
            }

            // Utility: decode Base64 to text (UTF-8 safe)
            function decodeFromBase64(base64Str) {
                try {
                    // Clean the input: remove all whitespace
                    const cleaned = base64Str.replace(/\s+/g, '');
                    if (cleaned.length === 0) return { text: '', error: null };

                    // Validate base64 characters
                    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(cleaned)) {
                        return { text: '', error: '无效的 Base64 字符' };
                    }

                    // Check padding
                    if (cleaned.includes('=')) {
                        const padIndex = cleaned.indexOf('=');
                        if (padIndex !== cleaned.length - 1 && padIndex !== cleaned.length - 2) {
                            return { text: '', error: '无效的 Base64 填充' };
                        }
                        // Ensure padding is only at the end
                        if (!/^[A-Za-z0-9+/]+={0,2}$/.test(cleaned)) {
                            return { text: '', error: '无效的 Base64 格式' };
                        }
                    }

                    const binary = atob(cleaned);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    const decoder = new TextDecoder('utf-8', { fatal: true });
                    const text = decoder.decode(bytes);
                    return { text, error: null };
                } catch (err) {
                    if (err instanceof TypeError && err.message.includes('fatal')) {
                        return { text: '', error: '解码结果不是有效的 UTF-8 文本' };
                    }
                    return { text: '', error: '无效的 Base64 字符串' };
                }
            }

            // Update encode output
            function updateEncodeOutput() {
                const inputText = encodeInput.value;
                const count = inputText.length;
                encodeInputCount.textContent = count + ' 字符';

                if (inputText === '') {
                    encodeOutput.value = '';
                    encodeOutputCount.textContent = '0 字符';
                    encodeOutput.classList.remove('error-state', 'success-state');
                    return;
                }

                const result = encodeToBase64(inputText);
                if (result !== null) {
                    encodeOutput.value = result;
                    encodeOutputCount.textContent = result.length + ' 字符';
                    encodeOutput.classList.remove('error-state');
                    encodeOutput.classList.add('success-state');
                } else {
                    encodeOutput.value = '';
                    encodeOutputCount.textContent = '0 字符';
                    encodeOutput.classList.remove('success-state');
                    encodeOutput.classList.add('error-state');
                }
            }

            // Update decode output
            function updateDecodeOutput() {
                const inputBase64 = decodeInput.value;
                const count = inputBase64.length;
                decodeInputCount.textContent = count + ' 字符';

                if (inputBase64.trim() === '') {
                    decodeOutput.value = '';
                    decodeOutputCount.textContent = '0 字符';
                    decodeOutput.classList.remove('error-state', 'success-state');
                    return;
                }

                const result = decodeFromBase64(inputBase64);
                if (result.error === null) {
                    decodeOutput.value = result.text;
                    decodeOutputCount.textContent = result.text.length + ' 字符';
                    decodeOutput.classList.remove('error-state');
                    decodeOutput.classList.add('success-state');
                } else {
                    decodeOutput.value = '';
                    decodeOutputCount.textContent = '0 字符';
                    decodeOutput.classList.remove('success-state');
                    decodeOutput.classList.add('error-state');
                    // Show error in output placeholder
                    decodeOutput.placeholder = result.error;
                    // Schedule clearing the error placeholder
                    clearTimeout(decodeOutput._errorTimeout);
                    decodeOutput._errorTimeout = setTimeout(() => {
                        decodeOutput.placeholder = '解码结果将实时显示在这里...';
                    }, 2500);
                }
            }

            // Copy to clipboard
            async function copyText(text, button) {
                if (!text || text.length === 0) return;
                try {
                    await navigator.clipboard.writeText(text);
                } catch (err) {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.pointerEvents = 'none';
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                    } catch (execErr) {
                        document.body.removeChild(textarea);
                        return;
                    }
                    document.body.removeChild(textarea);
                }
                // Visual feedback
                const span = button.querySelector('span');
                const originalText = span.textContent;
                span.textContent = '已复制！';
                button.classList.add('copied');
                // Find the associated output textarea
                const outputArea = button.closest('.output-group')?.querySelector('.output-area');
                if (outputArea) {
                    outputArea.classList.add('just-copied');
                    setTimeout(() => outputArea.classList.remove('just-copied'), 700);
                }
                clearTimeout(button._copyTimeout);
                button._copyTimeout = setTimeout(() => {
                    span.textContent = originalText;
                    button.classList.remove('copied');
                }, 1600);
            }

            // Swap contents
            function swapContents() {
                const encodeText = encodeOutput.value;
                const decodeText = decodeOutput.value;

                // Swap inputs
                const tempEncodeInput = encodeInput.value;
                encodeInput.value = decodeText;
                decodeInput.value = tempEncodeInput;

                // Update both outputs
                updateEncodeOutput();
                updateDecodeOutput();

                // Brief visual highlight
                encodeInput.style.borderColor = 'var(--accent)';
                decodeInput.style.borderColor = 'var(--accent)';
                setTimeout(() => {
                    encodeInput.style.borderColor = '';
                    decodeInput.style.borderColor = '';
                }, 600);
            }

            // Clear functions
            function clearEncode() {
                encodeInput.value = '';
                encodeOutput.value = '';
                encodeOutputCount.textContent = '0 字符';
                encodeInputCount.textContent = '0 字符';
                encodeOutput.classList.remove('error-state', 'success-state');
                encodeOutput.placeholder = '编码结果将实时显示在这里...';
                encodeInput.focus();
            }

            function clearDecode() {
                decodeInput.value = '';
                decodeOutput.value = '';
                decodeOutputCount.textContent = '0 字符';
                decodeInputCount.textContent = '0 字符';
                decodeOutput.classList.remove('error-state', 'success-state');
                decodeOutput.placeholder = '解码结果将实时显示在这里...';
                decodeInput.focus();
            }

            // Event listeners
            encodeInput.addEventListener('input', updateEncodeOutput);
            decodeInput.addEventListener('input', updateDecodeOutput);

            encodeCopyBtn.addEventListener('click', () => {
                copyText(encodeOutput.value, encodeCopyBtn);
            });

            decodeCopyBtn.addEventListener('click', () => {
                copyText(decodeOutput.value, decodeCopyBtn);
            });

            encodeClearBtn.addEventListener('click', clearEncode);
            decodeClearBtn.addEventListener('click', clearDecode);

            swapBtn.addEventListener('click', swapContents);

            // Keyboard shortcuts: Ctrl/Cmd+Enter to copy active output
            encodeOutput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    copyText(encodeOutput.value, encodeCopyBtn);
                }
            });
            decodeOutput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    copyText(decodeOutput.value, decodeCopyBtn);
                }
            });

            // Initialize counts
            updateEncodeOutput();
            updateDecodeOutput();

            // Auto-resize textareas (up to a max height)
            function autoResize(textarea) {
                textarea.style.height = 'auto';
                const maxHeight = 250;
                textarea.style.height = Math.min(textarea.scrollHeight, maxHeight) + 'px';
            }

            [encodeInput, decodeInput].forEach(ta => {
                ta.addEventListener('input', () => autoResize(ta));
            });

            // Set initial height
            [encodeInput, decodeInput].forEach(ta => {
                autoResize(ta);
            });
        })();
    </script>
</body>
</html>
