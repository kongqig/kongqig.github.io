<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>单位换算大全 · 全分类版</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e9ebef;--line2:#f3f4f7;--text:#15181e;--muted:#6b7280;--muted2:#9aa1ad;--accent:#2563eb;--accent-soft:#eff4ff;--radius:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--line:#252932;--line2:#1e222a;--text:#e8eaee;--muted:#9ba3b0;--muted2:#6b7382;--accent:#5b8cff;--accent-soft:#1b2438}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:100;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}}
.search{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none;width:18px;height:18px;color:var(--muted2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--text);font-family:inherit}
.search input::placeholder{color:var(--muted2)}
main{max-width:820px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card.hero{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.head{display:flex;gap:11px;align-items:flex-start}
.badge{flex:none;min-width:30px;height:30px;padding:0 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.head-txt{min-width:0;flex:1}
.title{font-size:17px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--muted);letter-spacing:0}
.sub{font-size:12.5px;color:var(--muted2);margin-top:1px}
.desc{font-size:13.5px;color:var(--muted);margin:11px 0 0;line-height:1.75}
.units{margin-top:14px;border-top:1px solid var(--line2)}
.unit{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line2)}
.unit:last-child{border-bottom:0}
.un-name{font-size:14px;font-weight:600;min-width:0}
.un-name .sym{font-weight:400;color:var(--muted2);font-size:12px;margin-left:4px}
.un-name .alias{font-weight:400;color:var(--muted2);font-size:12px}
.un-val{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.un-note{grid-column:1/-1;font-size:11.5px;color:var(--muted2);margin-top:2px;line-height:1.6}
.conv{margin-top:14px;padding:12px;border-radius:12px;background:var(--line2);border:1px solid var(--line)}
.conv-row{display:flex;gap:8px}
.conv-row input{flex:1 1 42%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;font-size:16px;color:var(--text);outline:0;font-family:inherit;font-variant-numeric:tabular-nums}
.conv-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.conv-row select{flex:1 1 58%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 26px 9px 10px;font-size:14px;color:var(--text);outline:0;font-family:inherit;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239aa1ad' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 9px center;background-size:10px;text-overflow:ellipsis}
.conv-row select:focus{border-color:var(--accent)}
.conv-mid{text-align:center;color:var(--muted2);font-size:13px;padding:5px 0;user-select:none}
.formulas{margin-top:14px;font-size:13px;color:var(--muted)}
.formulas b{display:block;color:var(--text);font-size:13px;margin-bottom:7px;font-weight:600}
.formulas code{display:inline-block;background:var(--line2);padding:3px 8px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;margin:2px 5px 2px 0;color:var(--text)}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#6b4d00;color:#ffe9a8}}
.empty{text-align:center;color:var(--muted2);padding:60px 20px;font-size:14px}
.sub-title{font-size:13px;font-weight:700;color:var(--text);margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.sub-title:first-of-type{border-top:0;padding-top:0;margin-top:12px}
.sub-title span{font-weight:400;color:var(--muted2);font-size:12px}
.special-note{font-size:12.5px;color:var(--muted2);margin-top:10px;padding:8px 12px;background:var(--line2);border-radius:8px;line-height:1.7}
</style>
</head>
<body>

<header class="top">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜索单位或简介，如：幺米、EB、当量、坎德拉、旦尼尔…" autocomplete="off" spellcheck="false">
  </div>
</header>

<main id="app"></main>

<script>
/* ========== 工具 ========== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(c=>SUP[c]||c).join('');
function fmtNum(x){if(x===0)return'0';if(!isFinite(x))return'—';const a=Math.abs(x);if(a>=1e-4&&a<1e9)return String(parseFloat(x.toPrecision(10)));const e=Math.floor(Math.log10(a)),m=x/Math.pow(10,e);return parseFloat(m.toPrecision(6))+'×10'+sup(e)}
function hl(t,q){t=String(t);if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
const U=(n,s,a,k,o)=>({n,s,a:a||'',k,o:o||0});
const R=(n,s,a,note)=>({n,s,a:a||'',note:note||''});

/* ========== 数据 ========== */
const DATA=[
/* ===== 0 常用 ===== */
{id:'common',type:'common',idx:'0',name:'常用单位',formal:'常用单位速查',alias:'日常高频',

/* ===== 1 长度 ===== */
{id:'length',idx:'1',name:'长度',formal:'长度单位',alias:'距离/尺寸',
 desc:'从极小的幺米（10⁻²⁴米）到极大的秒差距。公制、市制、英美制三套体系可自由换算。',
 base:'米',baseSym:'m',
 units:[U('幺米','ym','',1e-24),U('仄米','zm','',1e-21),U('阿米','am','',1e-18),U('飞米','fm','',1e-15),U('皮米','pm','',1e-12),U('纳米','nm','',1e-9),U('微米','μm','',1e-6),U('毫米','mm','',0.001),U('厘米','cm','公分',0.01),U('英寸','in','吋',0.0254),U('市寸','寸','',1/30),U('分米','dm','',0.1),U('英尺','ft','呎',0.3048),U('市尺','尺','',1/3),U('码','yd','',0.9144),U('米','m','公尺',1),U('市丈','丈','',10/3),U('市里','里','',500),U('千米','km','公里',1000),U('英里','mi','哩',1609.344),U('海里','nmi','',1852),U('天文单位','AU','',1.495978707e11),U('光年','ly','',9.4607304725808e15),U('秒差距','pc','',3.0856775814913673e16)],
 formulas:['1 千米 = 1000 米；1 米 = 100 厘米 = 1000 毫米','1 市里 = 150 丈 = 500 米；1 丈 = 10 尺；1 尺 = 10 寸','1 英里 = 5280 英尺 ≈ 1609.34 米','1 英寸 = 2.54 厘米','1 光年 ≈ 9.46 万亿千米；1 秒差距 ≈ 3.26 光年']},

/* ===== 2 面积 ===== */
{id:'area',idx:'2',name:'面积',formal:'面积单位',alias:'地亩/平面大小',

{id:'volume',idx:'3',name:'体积与容量',formal:'体积/容积单位',alias:'容量',

/* ===== 4 质量 ===== */
{id:'mass',idx:'4',name:'质量',formal:'质量单位',alias:'重量',

/* ===== 5 温度 ===== */
{id:'temperature',idx:'5',name:'温度',formal:'温度单位',alias:'冷热',
 desc:'摄氏度冰点 0°、沸点 100°；华氏度冰点 32°、沸点 212°；开尔文以绝对零度为 0 K。温度换算是"先乘系数再加偏移"。',
 base:'摄氏度',baseSym:'°C',affine:true,
 units:[U('摄氏度','°C','摄氏',1,0),U('华氏度','°F','华氏',5/9,-160/9),U('开尔文','K','绝对温度',1,-273.15),U('兰氏度','°R','',5/9,-273.15)],
 formulas:['华氏度 = 摄氏度 × 9 ÷ 5 + 32','摄氏度 = (华氏度 − 32) × 5 ÷ 9','开尔文 = 摄氏度 + 273.15','摄氏度 = 开尔文 − 273.15','兰氏度 = (摄氏度 + 273.15) × 9 ÷ 5']},

/* ===== 6 时间 ===== */
{id:'time',idx:'6',name:'时间',formal:'时间单位',alias:'时长',
 desc:'从纳秒到世纪。注意「月」和「年」没有固定长度，这里按平均 30 天 / 365 天计算。',
 base:'秒',baseSym:'s',

const COMMON_DEFAULTS={length:['米','厘米'],mass:['千克','市斤'],area:['亩','平方米'],volume:['升','毫升'],temperature:['摄氏度','华氏度']};

/* ========== 渲染 ========== */
const app=document.getElementById('app');
const searchInput=document.getElementById('q');
const catById={};DATA.forEach(c=>{catById[c.id]=c});

function converterHTML(units,defA,defB){
  const opts=units.map(u=>`<option value="${esc(u.n)}">${esc(u.n)}${u.s?' '+esc(u.s):''}</option>`).join('');
  return `<div class="conv" data-a="${esc(defA)}" data-b="${esc(defB)}">
    <div class="conv-row"><input class="cv-in" type="text" inputmode="decimal" value="1" aria-label="数值"><select class="cv-sel" aria-label="单位">${opts}</select></div>
    <div class="conv-mid">⇅</div>
    <div class="conv-row"><input class="cv-in" type="text" inputmode="decimal" aria-label="数值"><select class="cv-sel" aria-label="单位">${opts}</select></div>
  </div>`;
}

function initConverter(conv,units){
  const inputs=conv.querySelectorAll('.cv-in'),sels=conv.querySelectorAll('.cv-sel');
  sels[0].value=conv.dataset.a;sels[1].value=conv.dataset.b;
  const get=n=>units.find(u=>u.n===n);
  const toBase=(v,u)=>v*u.k+(u.o||0);
  const fromBase=(b,u)=>(b-(u.o||0))/u.k;
  function calc(from){
    const to=1-from,uA=get(sels[from].value),uB=get(sels[to].value);
    if(!uA||!uB)return;
    const raw=inputs[from].value.replace(/[,，\s]/g,''),v=parseFloat(raw);
    if(!isFinite(v)){inputs[to].value='';return}
    inputs[to].value=fmtNum(fromBase(toBase(v,uA),uB));
  }
  inputs[0].addEventListener('input',()=>calc(0));
  inputs[1].addEventListener('input',()=>calc(1));
  sels.forEach((s,i)=>s.addEventListener('change',()=>calc(i)));
  calc(0);
}

function unitsHTML(cat,q){
  const sorted=cat.affine||cat.special?cat.units:cat.units.slice().sort((a,b)=>a.k-b.k);
  return sorted.map(u=>{
    const nameHtml=hl(u.n,q)+(u.s?`<span class="sym">${hl(u.s,q)}</span>`:'')+(u.a?`<span class="alias">（${hl(u.a,q)}）</span>`:'');
    let valHtml='',noteHtml='';
    if(cat.special){valHtml='<span style="color:var(--muted2)">参考</span>';if(u.note)noteHtml=`<div class="un-note">${hl(u.note,q)}</div>`}
    else if(cat.affine){valHtml='<span style="color:var(--muted2)">按公式</span>'}
    else{valHtml=`= ${fmtNum(u.k)} ${esc(cat.base)}`}
    return `<div class="unit"><div class="un-name">${nameHtml}</div><div class="un-val">${valHtml}</div>${noteHtml}</div>`;
  }).join('');
}

function cardHTML(cat,q){
  const realUnits=cat.affine||cat.special?cat.units:cat.units.slice().sort((a,b)=>a.k-b.k);
  const defs=COMMON_DEFAULTS[cat.id]||[realUnits[0].n,realUnits[1]?realUnits[1].n:realUnits[0].n];
  const defA=realUnits.find(u=>u.n===defs[0])?defs[0]:realUnits[0].n;
  const defB=realUnits.find(u=>u.n===defs[1])?defs[1]:realUnits[Math.min(1,realUnits.length-1)].n;
  const convHTML=cat.special?'':converterHTML(cat.units,defA,defB);
  const note=cat.special?'<div class="special-note">此分类为无量纲、参考性或汇率波动类，不提供自动换算，请查看下方公式和说明。</div>':'';
  const formulas=cat.formulas?`<div class="formulas"><b>换算公式 / 说明</b>${cat.formulas.map(f=>`<code>${esc(f)}</code>`).join('')}</div>`:'';
  return `<section class="card" data-cat="${cat.id}">
    <div class="head"><div class="badge">${cat.idx}</div>
      <div class="head-txt"><div class="title">${hl(cat.name,q)}<span class="tag">${hl(cat.alias,q)}</span></div>
      <div class="sub">${hl(cat.formal,q)}</div></div></div>
    <p class="desc">${hl(cat.desc,q)}</p>${convHTML}${note}
    <div class="units">${unitsHTML(cat,q)}</div>${formulas}</section>`;
}

function commonHTML(cat,q){
  const blocks=cat.refs.map(id=>{
    const sub=catById[id],d=COMMON_DEFAULTS[id];
    const realUnits=sub.units.slice().sort((a,b)=>a.k-b.k);
    const defA=realUnits.find(u=>u.n===d[0])?d[0]:realUnits[0].n;
    const defB=realUnits.find(u=>u.n===d[1])?d[1]:realUnits[Math.min(1,realUnits.length-1)].n;
    return `<div class="sub-title">${esc(sub.name)}<span>${esc(sub.alias)}</span></div>${converterHTML(sub.units,defA,defB)}`;
  }).join('');
  return `<section class="card hero" data-cat="common">
    <div class="head"><div class="badge">${cat.idx}</div>
      <div class="head-txt"><div class="title">${esc(cat.name)}<span class="tag">${esc(cat.alias)}</span></div>
      <div class="sub">${esc(cat.formal)}</div></div></div>
    <p class="desc">${esc(cat.desc)}</p>${blocks}</section>`;
}

function render(){
  const q=searchInput.value.trim().toLowerCase();
  let html='';
  DATA.forEach(cat=>{
    if(cat.type==='common'){if(!q)html+=commonHTML(cat,'');return}
    let hit=false;
    if(!q)hit=true;
    else{
      const hay=[cat.name,cat.formal,cat.alias,cat.desc].join(' ').toLowerCase();
      if(hay.includes(q))hit=true;
      else{
        for(const u of cat.units){const uh=[u.n,u.s,u.a||''].join(' ').toLowerCase();if(uh.includes(q)){hit=true;break}}
        if(!hit&&cat.formulas){for(const f of cat.formulas){if(f.toLowerCase().includes(q)){hit=true;break}}}
      }
    }
    if(hit)html+=cardHTML(cat,q);
  });
  if(!html.trim())html=`<div class="empty">没有找到匹配的单位 😕<br>换个关键词试试，比如「幺米」「EB」「当量」「坎德拉」「旦尼尔」</div>`;
  app.innerHTML=html;
  app.querySelectorAll('.conv').forEach(conv=>{
    const catEl=conv.closest('[data-cat]'),catId=catEl.dataset.cat;
    let units;
    if(catId==='common'){
      const allConvs=Array.from(catEl.querySelectorAll('.conv'));
      const idx=allConvs.indexOf(conv);
      units=catById[catById.common.refs[idx]].units;
    }else{units=catById[catId].units}
    initConverter(conv,units);
  });
}

let timer=null;
searchInput.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,120)});
render();
</script>
</body>
</html>
