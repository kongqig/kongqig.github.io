<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="红色工具箱 - 快速访问国家官方网站" />
<title>红色工具箱 · 快速访问国家官方网站</title>
<link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>

<!-- ========== 顶栏 ========== -->
<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="./" aria-label="红色工具箱首页">
      <span class="brand-mark" aria-hidden="true">★</span>
      <span class="brand-text">
        <strong>红色工具箱</strong>
        <small>快速访问国家官方网站</small>
      </span>
    </a>
    <div class="header-actions">
      <button class="guide-btn" type="button" id="guide-btn">📋 办事指南</button>
    </div>
    <div class="header-meta" id="header-meta" aria-live="polite">加载中…</div>
  </div>
</header>

<!-- ========== 主布局：侧栏（搜索/快捷/分类） + 主内容 ========== -->
<main class="app-layout">

  <!-- -------- 侧栏（移动=块流，桌面=左侧 sticky） -------- -->
  <aside class="sidebar">

    <!-- 搜索 -->
    <section class="panel">
      <div class="search-wrap">
        <label class="visually-hidden" for="search">搜索网站</label>
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search" class="search-input" type="search"
               placeholder="搜索名称 / 网址 / 描述，支持 * 和 ?"
               autocomplete="off" spellcheck="false" />
        <button class="clear-btn" type="button" id="clear-btn" aria-label="清空搜索" hidden>✕</button>
      </div>

      <p class="search-hint" id="search-hint">
        无通配符按子串匹配，例如「税务」；<code>*</code> 匹配任意字符序列，<code>?</code> 匹配单字符。
        <button class="hint-toggle" type="button" id="hint-toggle" aria-label="查看搜索说明">?</button>
      </p>
    </section>

    <!-- 快捷方式 -->
    <section class="panel" id="quick-panel" hidden>
      <h2 class="sidebar-title">快捷方式</h2>
      <div class="quick-grid" id="quick-grid">
        <!-- 快捷按钮由 JS 动态生成 -->
      </div>
    </section>

    <!-- 分类（移动端折叠面板：默认收起；桌面端常显） -->
    <section class="panel">
      <h2 class="sidebar-title">分类</h2>
      <details class="cat-fold" id="cat-fold">
        <summary>
          <span class="summary-left">当前：<b id="cat-now">全部</b></span>
          <span class="summary-right">
            <span class="summary-count" id="cat-fold-count">共 0 个</span>
            <span class="chev" aria-hidden="true">▾</span>
          </span>
        </summary>
        <div class="cat-body">
          <label class="visually-hidden" for="cat-filter">筛选分类</label>
          <input id="cat-filter" class="cat-filter" type="search"
                 placeholder="搜索分类…" autocomplete="off" />
          <span class="cat-count" id="cat-count"></span>
          <nav class="categories" id="categories" aria-label="按分类筛选">
            <!-- 分类项由 JS 动态生成 -->
          </nav>
        </div>
      </details>
    </section>

  </aside>

  <!-- -------- 主内容 -------- -->
  <div class="main-col">

    <div class="results-meta">
      <span id="result-count">—</span>
      <button class="reset-btn" type="button" id="reset-btn" hidden>重置筛选</button>
    </div>

    <section id="results" class="results" aria-live="polite">
      <!-- 网站卡片由 JS 动态生成 -->
    </section>

    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon" aria-hidden="true">⊘</div>
      <p class="empty-title">未找到匹配的网站</p>
      <p class="empty-hint">试试更换关键词，或用通配符，例如「*政府*」</p>
    </div>

    <div class="empty-state is-error" id="error-state" hidden>
      <div class="empty-icon" aria-hidden="true">!</div>
      <p class="empty-title">数据加载失败</p>
      <p class="empty-hint" data-err-msg>请通过本地服务器访问（如 <code>python -m http.server</code>），不能直接双击打开 HTML。</p>
    </div>

  </div>
</main>

<!-- ========== 办事指南（移动=底部抽屉 / 桌面=右侧抽屉） ========== -->
<div class="modal" id="guide-modal" hidden>
  <div class="modal-overlay" data-close-modal></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="guide-title">
    <div class="modal-head">
      <h2 id="guide-title">📋 行政办事指南</h2>
      <button class="modal-close" type="button" data-close-modal aria-label="关闭">✕</button>
    </div>
    <div class="modal-tabs" role="tablist">
      <button class="modal-tab" role="tab" aria-selected="true" data-tab="guide">办事找谁</button>
      <button class="modal-tab" role="tab" aria-selected="false" data-tab="depts">部门职责</button>
      <button class="modal-tab" role="tab" aria-selected="false" data-tab="levels">行政等级</button>
      <button class="modal-tab" role="tab" aria-selected="false" data-tab="phones">☎️ 联系电话</button>
    </div>
    <div class="modal-search">
      <input id="guide-search" type="search"
             placeholder="搜索办事事项，如：身份证、护照、社保…" autocomplete="off" />
    </div>
    <div class="modal-body" id="guide-body">
      <p class="modal-loading">加载中…</p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>红色工具箱 · 浏览器版 · 数据共 <span id="footer-count">—</span> 条官方网站</p>
  <p>本人精力有限，所以数据多为AI辅助收集，或有错漏，请见谅。</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=7"></script>
</body>
</html>
