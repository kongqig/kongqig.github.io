<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #8e8e9a;
            font-weight: 400;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e8e8f0;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            color: #1a1a2e;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input::placeholder {
            color: #b0b0be;
        }

        .search-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item.hidden {
            display: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 24px;
            text-decoration: none;
            color: #1a1a2e;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .nav-item:active {
            transform: translateY(0);
        }

        .nav-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .icon-base64 {
            background: #eef2ff;
            color: #6366f1;
        }

        .icon-rtool {
            background: #fef2f2;
            color: #ef4444;
        }

        .icon-danwei {
            background: #ecfdf5;
            color: #10b981;
        }

        .icon-hub {
            background: #eff6ff;
            color: #3b82f6;
        }

        .icon-mc {
            background: #f5f3ff;
            color: #8b5cf6;
        }

        .nav-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-name {
            font-size: 16px;
            font-weight: 600;
        }

        .nav-desc {
            font-size: 13px;
            color: #8e8e9a;
        }

        .nav-arrow {
            margin-left: auto;
            color: #c0c0cc;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #b0b0be;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>工具箱</h1>
            <p class="subtitle">实用在线工具集合</p>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" placeholder="搜索工具..." id="searchInput">
        </div>

        <div class="nav-list">
            <a class="nav-item" href="./tools/base64tool.html">
                <div class="nav-icon icon-base64">64</div>
                <div class="nav-info">
                    <span class="nav-name">Base64 工具</span>
                    <span class="nav-desc">编码 / 解码</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a class="nav-item" href="./rtool/index.html">
                <div class="nav-icon icon-rtool">🔴</div>
                <div class="nav-info">
                    <span class="nav-name">红色工具箱</span>
                    <span class="nav-desc">多功能实用工具</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a class="nav-item" href="./tools/danweidaquan.html">
                <div class="nav-icon icon-danwei">📐</div>
                <div class="nav-info">
                    <span class="nav-name">单位换算大全</span>
                    <span class="nav-desc">全分类单位换算</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a class="nav-item" href="./tools/hub-locator.html">
                <div class="nav-icon icon-hub">🌐</div>
                <div class="nav-info">
                    <span class="nav-name">多城枢纽定位器</span>
                    <span class="nav-desc">多城市方位距离定位</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a class="nav-item" href="./tools/sanjiaohanshudingweimodichuansongmen.html">
                <div class="nav-icon icon-mc">🟣</div>
                <div class="nav-info">
                    <span class="nav-name">MC 末地传送门定位器</span>
                    <span class="nav-desc">三角定位末地传送门</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>
        </div>

        <p class="footer">kongqig.github.io</p>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const navItems = document.querySelectorAll('.nav-item');

        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase().trim();
            navItems.forEach(function (item) {
                const name = item.querySelector('.nav-name').textContent.toLowerCase();
                const desc = item.querySelector('.nav-desc').textContent.toLowerCase();
                if (name.includes(query) || desc.includes(query)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
